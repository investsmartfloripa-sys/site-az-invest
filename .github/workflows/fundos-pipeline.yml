name: Fundos pipeline (Fundos de Investimento — Mais Retorno)

# Ranking de fundos por categoria via Mais Retorno Data API.
# Cadência alvo: A CADA 2 DIAS — 0 11 UTC = 08:00 BRT (dados D-1).
#   ⚠️ COTA (free = 500 req/mês): 41 fundos × 1 req/fundo × ~15 rodadas/mês
#   ≈ 615 req/mês, que ESTOURA o free. ANTES de ligar a automação (criar o
#   secret MAISRETORNO_API_KEY), escolher uma destas:
#     (a) batch via compare_assets em pares (~2 fundos/chamada → ~315/mês, cabe);
#     (b) reduzir p/ ~2x/semana (cron "0 11 * * 2,5");
#     (c) assinar o Basic (1.500/mês).
on:
  schedule:
    - cron: "0 11 */2 * *"
  workflow_dispatch:
    inputs:
      with_drawdown:
        description: "Buscar drawdown (1 chamada extra por fundo; cuidado com a cota)"
        required: false
        default: "0"
      with_quotes:
        description: "Gerar fundos_quotes.json (série de cota p/ gráficos; ~46 req extras — pesado na cota)"
        required: false
        default: "0"

concurrency:
  group: fundos-pipeline
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      MAISRETORNO_API_KEY: ${{ secrets.MAISRETORNO_API_KEY }}
      MAISRETORNO_PLAN: ${{ vars.MAISRETORNO_PLAN || 'free' }}
      PYTHONUTF8: "1"
      SITE_BASE: https://investimentosdeaz.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt

      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt

      - name: build_fundos_ranking (Mais Retorno)
        id: ranking
        run: |
          python data-pipeline/python/build_fundos_ranking.py --upload \
            ${{ github.event.inputs.with_drawdown == '1' && '--with-drawdown' || '' }}
        continue-on-error: true

      # Cotas p/ os gráficos da página de detalhe — PESADO (~46 req). Só no
      # disparo manual com with_quotes=1 (a série muda devagar; não precisa
      # rodar a cada 2 dias). No free, rodar com parcimônia.
      - name: build_fundos_quotes (séries p/ gráficos)
        id: quotes
        if: ${{ github.event.inputs.with_quotes == '1' }}
        run: python data-pipeline/python/build_fundos_quotes.py --upload
        continue-on-error: true

      - name: Upload artefatos (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundos-pipeline-${{ github.run_id }}
          path: |
            data-pipeline/out/fundos_ranking.json
            data-pipeline/out/fundos_quotes.json
          if-no-files-found: warn
          retention-days: 7

      # O Blob ja esta novo mas o site serviria o dado velho por ate ~2h (Data Cache
      # do fetch + ISR da pagina). Aqui o pipeline avisa o site que purga tag + rota
      # na hora. Falhar aqui REPROVA a run de proposito: nenhum job depende deste
      # step entao reprovar nao perde upload nenhum e purga morrendo em silencio foi
      # a causa raiz de 11/08/2026.
      - name: Purgar cache do site (Fundos de Investimento)
        if: always()
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"fundos-pipeline.yml","paths":["/painel-economico/mercado/brasil/fundos-investimento/[slug]"]}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::purga de cache falhou (HTTP ${code:-sem-resposta}) - o painel pode servir dado velho ate o TTL vencer"
            exit 1
          fi

      # DESCOBERTO EM 13/08/2026: a aba de Fundos servia dado de 16/06 ha 58 dias.
      # O build morria em `MAISRETORNO_API_KEY ausente`, o continue-on-error acima
      # segurava a falha e a run terminava VERDE - ninguem foi avisado. O
      # continue-on-error continua certo (uma fonte quebrada nao pode derrubar a
      # outra), mas agora o job REPROVA no fim, igual ao familias-pipeline.
      - name: Falhar se algum build quebrou
        if: always()
        run: |
          quebrou=0
          if [ "${{ steps.ranking.outcome }}" = "failure" ]; then
            echo "::error::build_fundos_ranking falhou - a aba de Fundos vai servir dado CONGELADO ate isso ser corrigido"
            quebrou=1
          fi
          if [ "${{ steps.quotes.outcome }}" = "failure" ]; then
            echo "::error::build_fundos_quotes falhou - graficos da pagina de detalhe ficam congelados"
            quebrou=1
          fi
          if [ "$quebrou" = "1" ]; then exit 1; fi
          echo "builds ok"
