name: Data pipeline (Painel Panorama)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: data-pipeline-panorama
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      DATA_PIPELINE_OUT: ${{ github.workspace }}/data-pipeline/out
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SITE_BASE: https://investimentosdeaz.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt

      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt

      - name: Python panorama JSON
        run: python data-pipeline/python/run_panorama_builds.py
        # exit 2 = payload vazio preservado no Blob; nao pode derrubar os steps R seguintes
        continue-on-error: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::readr
            any::dplyr
            any::tidyr
            any::lubridate
            any::ggplot2
            any::svglite
            any::jsonlite
            any::scales
            any::tibble
            any::rlang
            any::rb3

      - name: R yield curves SVG
        run: Rscript data-pipeline/r/build_yield_curves_svg.R

      - name: R Treasury EUA SVG
        run: Rscript data-pipeline/r/build_treasury_us_svg.R
        continue-on-error: true

      - name: R Selic implicita SVG
        run: Rscript data-pipeline/r/build_selic_implicita.R
        continue-on-error: true

      - name: R Fed implicita SVG
        run: Rscript data-pipeline/r/build_fed_implicita.R
        continue-on-error: true

      - name: Upload SVGs to Blob
        run: python data-pipeline/python/upload_static_charts.py

      # O Blob ja esta novo mas o site serviria o dado velho por ate ~2h (Data Cache
      # do fetch + ISR da pagina). Aqui o pipeline avisa o site que purga tag + rota
      # na hora. Falhar aqui REPROVA a run de proposito: nenhum job depende deste
      # step entao reprovar nao perde upload nenhum e purga morrendo em silencio foi
      # a causa raiz de 11/08/2026.
      - name: Purgar cache do site (Painel Panorama)
        if: always()
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"data-pipeline.yml","blobPaths":["charts/tables/juros_prefixado.json","charts/tables/juros_ipca.json","charts/tables/selic_implicita.json","charts/tables/juros_treasury_us.json","charts/tables/fed_implicita.json"]}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::purga de cache falhou (HTTP ${code:-sem-resposta}) - o painel pode servir dado velho ate o TTL vencer"
            exit 1
          fi
