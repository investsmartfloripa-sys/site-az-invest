name: Fiscal pipeline (Termômetro Fiscal)

on:
  # 9h BRT (UTC-3) = 12h UTC — após release das séries BCB SGS
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: fiscal-pipeline
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ secrets.NEXT_PUBLIC_BLOB_BASE_URL }}
      SITE_BASE: https://investimentosdeaz.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt

      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt

      # continue-on-error em cada build: falha do fiscal (ex. BCB SGS fora do ar)
      # não pode derrubar o termômetro em cascata (mesmo padrão do visao-geral-pipeline).
      - name: Build Fiscal clássicos + upload Blob
        run: python data-pipeline/python/build_fiscal.py --upload
        continue-on-error: true

      - name: Build Termômetro Fiscal + upload Blob
        run: python data-pipeline/python/build_fiscal_termometro.py --upload
        continue-on-error: true

      # O Blob já está novo, mas o site serviria o dado velho por até ~2h (Data
      # Cache do fetch + ISR da página). Aqui o pipeline avisa o site, que purga
      # tag + rota na hora. Nunca derruba o pipeline, mas fica VERMELHO se o site
      # não responder 200 — purga morrendo em silêncio foi a causa do incidente.
      - name: Purgar cache do site (Fiscal + Termômetro)
        if: always()
        continue-on-error: true
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"fiscal-pipeline.yml"}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          test "$code" = "200"
