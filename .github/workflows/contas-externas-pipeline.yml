name: Contas Externas pipeline (BCB BPM6 + Comex Stat)

# BCB SGS atualiza diariamente (reservas) e mensalmente (BP).
# SECEX Comex Stat atualiza mensalmente (defasagem ~1 mês).
# Cron diário cobre os dois — Comex tem rate limit interno, rodada inteira leva ~3min.

on:
  schedule:
    - cron: "30 23 * * *"  # 23h30 UTC = 20h30 BRT
  workflow_dispatch:

concurrency:
  group: contas-externas-pipeline
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}
      SITE_BASE: https://investimentosdeaz.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt
      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt
      - name: Build BCB JSON e upload
        run: python data-pipeline/python/build_contas_externas.py --upload
      - name: Build Comex Stat JSON e upload
        run: python data-pipeline/python/build_contas_externas_comex.py --upload
      # Sub-área Câmbio econômico (REER, paridade de juros, UIP). O builder
      # valida antes de publicar e NUNCA sobrescreve dado bom com vazio;
      # continue-on-error p/ uma falha de FRED/SGS não derrubar o resto.
      - name: Build Câmbio macro JSON e upload
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python data-pipeline/python/build_cambio_macro.py --upload
      # O Blob já está novo, mas o site serviria o dado velho por até ~2h (Data
      # Cache do fetch + ISR da página). Aqui o pipeline avisa o site, que purga
      # tag + rota na hora. Nunca derruba o pipeline, mas fica VERMELHO se o site
      # não responder 200 — purga morrendo em silêncio foi a causa do incidente.
      - name: Purgar cache do site (Contas externas + Câmbio)
        if: always()
        continue-on-error: true
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"contas-externas-pipeline.yml"}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          test "$code" = "200"
