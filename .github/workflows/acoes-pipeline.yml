name: Acoes pipeline (Renda Variável — Ibovespa)

# Roda 1x por dia útil após o fechamento do pregão, depois do market-data.yml
# (que gera market_history_full.json e market_fundamentals.json no Blob, lidos aqui).
#   45 22 UTC = 19:45 BRT (15 min após o market-data.yml)
#   45 00 UTC do dia seguinte = 21:45 BRT (retry se a 1ª execução falhou)
on:
  schedule:
    - cron: "45 22 * * 1-5"
    - cron: "45 0 * * 2-6"
  workflow_dispatch:
    inputs:
      run_valuation:
        description: "Rodar build_acoes_valuation (pesado: ~5min, ~85 tickers x yfinance)"
        required: false
        default: "1"

concurrency:
  group: acoes-pipeline
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      PYTHONUTF8: "1"
      SITE_BASE: https://investimentosdeaz.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt

      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt

      # Hero do Ibovespa + benchmarks (lê market_history_full do Blob + CDI SGS) — leve
      - name: build_acoes_ibov (hero + benchmarks)
        run: python data-pipeline/python/build_acoes_ibov.py --upload
        continue-on-error: true

      # Screener (universo IBOV + métricas; Blob first, yfinance nas lacunas) — ~2 min
      - name: build_acoes_screener (universo IBOV)
        run: python data-pipeline/python/build_acoes_screener.py --upload
        continue-on-error: true

      # Logos das empresas (TradingView symbol-search -> s3-symbol-logo) — leve, ~30s
      - name: build_acoes_logos (logos das empresas)
        run: python data-pipeline/python/build_acoes_logos.py --upload
        continue-on-error: true

      # Preço x retorno total (preço + dividendos reinvestidos) por papel — yfinance, ~2-3 min
      - name: build_acoes_total_return (preço + dividendos)
        run: python data-pipeline/python/build_acoes_total_return.py --upload
        continue-on-error: true

      # Valuation (P/L bottom-up + prêmio EY/DY vs NTN-B) — pesado, ~5 min, append-only
      # ATENÇÃO: em runs de `schedule` o github.event.inputs não existe e o if
      # antigo (inputs.run_valuation != '0') avaliava FALSE — o step era PULADO
      # silenciosamente em todo cron (valuation ficou parado 01-04/06/26).
      - name: build_acoes_valuation (P/L bandas + prêmio)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_valuation != '0' }}
        run: python data-pipeline/python/build_acoes_valuation.py --upload --sleep 0.2
        continue-on-error: true

      - name: Upload artefatos (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acoes-pipeline-${{ github.run_id }}
          path: |
            data-pipeline/out/acoes_ibov.json
            data-pipeline/out/acoes_screener.json
            data-pipeline/out/acoes_logos.json
            data-pipeline/out/acoes_total_return.json
            data-pipeline/out/acoes_valuation.json
          if-no-files-found: warn
          retention-days: 7

      # O Blob ja esta novo mas o site serviria o dado velho por ate ~2h (Data Cache
      # do fetch + ISR da pagina). Aqui o pipeline avisa o site que purga tag + rota
      # na hora. Falhar aqui REPROVA a run de proposito: nenhum job depende deste
      # step entao reprovar nao perde upload nenhum e purga morrendo em silencio foi
      # a causa raiz de 11/08/2026.
      - name: Purgar cache do site (Ações — Ibovespa)
        if: always()
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"acoes-pipeline.yml"}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::purga de cache falhou (HTTP ${code:-sem-resposta}) - o painel pode servir dado velho ate o TTL vencer"
            exit 1
          fi
