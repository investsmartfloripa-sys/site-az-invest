name: Visao Geral pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: visao-geral-pipeline
  cancel-in-progress: true

jobs:
  fontes-externas:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt
      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt
      # continue-on-error em cada fonte: um timeout (ex. SIDRA 04/06/26) não pode
      # derrubar as fontes seguintes em cascata (ragged-edge, nunca all-or-nothing).
      - name: OECD CLI Brasil
        run: python data-pipeline/python/build_visao_geral_oecd_cli.py --upload --soft-fail
        continue-on-error: true
      - name: BCB SGS Credito e Agregados
        run: python data-pipeline/python/build_visao_geral_credito.py --upload --soft-fail
        continue-on-error: true
      - name: Antecedentes financeiros (Slope DI + Ibov real + EMBI)
        run: python data-pipeline/python/build_visao_geral_antecedentes_fin.py --upload --soft-fail
        continue-on-error: true
      - name: PNAD renda (income leg quartet TCB)
        run: python data-pipeline/python/build_visao_geral_pnad_renda.py --upload --soft-fail
        continue-on-error: true
      - name: Probit AZ Hibrido (3 modelos base + Ridge L2 sobre ~30 antecedentes)
        run: python data-pipeline/python/build_visao_geral_probit_az.py --upload --soft-fail
        continue-on-error: true
      - name: ANP combustiveis
        run: python data-pipeline/python/build_visao_geral_anp.py --upload --soft-fail
        continue-on-error: true
      - name: ANFAVEA veiculos
        run: python data-pipeline/python/build_visao_geral_anfavea.py --upload --soft-fail
        continue-on-error: true
      - name: EPE energia
        run: python data-pipeline/python/build_visao_geral_epe.py --upload --soft-fail
        continue-on-error: true
      - name: CODACE cronologia
        run: python data-pipeline/python/build_visao_geral_codace.py --upload --soft-fail
        continue-on-error: true
      - name: IPEADATA (papelao, aco, FENABRAVE, CNC, Fecomercio)
        run: python data-pipeline/python/build_visao_geral_ipeadata.py --upload --soft-fail
        continue-on-error: true

  scrapers-confianca:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt
      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt
      - name: FGV antecedentes
        run: python data-pipeline/python/build_visao_geral_fgv_antecedentes.py --upload --soft-fail
        continue-on-error: true
      - name: FGV confiancas
        run: python data-pipeline/python/build_visao_geral_fgv_confianca.py --upload --soft-fail
        continue-on-error: true
      - name: CNI
        run: python data-pipeline/python/build_visao_geral_cni.py --upload --soft-fail
        continue-on-error: true
      - name: PMI Brasil
        run: python data-pipeline/python/build_visao_geral_pmi.py --upload --soft-fail
        continue-on-error: true
      - name: Fecomercio SP
        run: python data-pipeline/python/build_visao_geral_fecomercio.py --upload --soft-fail
        continue-on-error: true

  scrapers-hard-data:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt
      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt
      - name: Hard data
        run: python data-pipeline/python/build_visao_geral_hard_data.py --upload --soft-fail
        continue-on-error: true

  derivados:
    runs-on: ubuntu-latest
    needs: [fontes-externas, scrapers-confianca, scrapers-hard-data]
    # Roda mesmo se algum job de fonte falhou: os derivados leem o Blob
    # (que preserva o último dado válido de cada fonte).
    if: ${{ always() }}
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}
      SITE_BASE: https://investimentosdeaz.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/python/requirements.txt
      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/python/requirements.txt
          pip install numpy
      - name: Hiato HP + Hamilton
        run: python data-pipeline/python/build_visao_geral_hiato.py --upload --soft-fail
      - name: ICF proprio
        run: python data-pipeline/python/build_visao_geral_icf.py --upload --soft-fail

      # Último step do último job: o Blob já está novo, mas o site serviria o
      # dado velho por até ~2h (Data Cache do fetch + ISR da página). Aqui o
      # pipeline avisa o site, que purga tag + rota na hora. Nunca derruba o
      # pipeline, mas fica VERMELHO se o site não responder 200 — purga que
      # morre em silêncio foi a causa raiz do atraso do IPCA em 11/08/2026.
      - name: Purgar cache do site (Visão Geral)
        if: always()
        continue-on-error: true
        run: |
          code=$(curl -s -o resposta.json -w '%{http_code}' --max-time 30 \
            -X POST "$SITE_BASE/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"visao-geral-pipeline.yml"}' || true)
          echo "HTTP ${code:-sem-resposta}"
          cat resposta.json || true
          echo
          test "$code" = "200"

  # Job "modelos-recessao" (build_visao_geral_recessao.py) removido em 2026-06:
  # a UI nao consome mais o JSON de 5 modelos — substituido por
  # build_visao_geral_probit_az.py + build_visao_geral_codace.py.
